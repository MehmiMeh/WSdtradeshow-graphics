<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphics HQ — Trade Show Design Coordination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- Top bar -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="logo-mark"><i class="ti ti-star" aria-hidden="true"></i></div>
        <div>
          <h1>Graphics HQ</h1>
          <p>Trade show design coordination</p>
        </div>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <button class="nav-btn active" onclick="go('dash')">
          <i class="ti ti-layout-dashboard" aria-hidden="true"></i> Dashboard
        </button>
        <button class="nav-btn" onclick="go('tasks')">
          <i class="ti ti-checklist" aria-hidden="true"></i> All tasks
        </button>
        <button class="nav-btn" onclick="go('brief')">
          <i class="ti ti-file-description" aria-hidden="true"></i> Designer brief
        </button>
      </nav>
    </div>

    <!-- ── DASHBOARD ── -->
    <div class="pane" id="pane-dash">
      <div class="stats" id="statsRow"></div>

      <div class="sec-hdr">
        <span class="sec-title">
          <i class="ti ti-calendar-event" aria-hidden="true"></i> Events
        </span>
        <button class="add-btn ghost" onclick="toggleForm('evForm')">
          <i class="ti ti-plus" aria-hidden="true"></i> Add event
        </button>
      </div>

      <!-- Add-event form -->
      <div class="form-panel" id="evForm" style="display:none">
        <h3><i class="ti ti-calendar-plus" aria-hidden="true"></i> New event</h3>
        <div class="f-row">
          <div class="fg">
            <label for="evName">Event name</label>
            <input id="evName" placeholder="e.g. PRINTING United 2026" />
          </div>
          <div class="fg">
            <label for="evDates">Event dates</label>
            <input id="evDates" placeholder="e.g. Oct 22–24, 2026" />
          </div>
        </div>
        <div class="f-row">
          <div class="fg">
            <label for="evVenue">City / venue</label>
            <input id="evVenue" placeholder="e.g. Las Vegas Convention Center" />
          </div>
          <div class="fg">
            <label for="evDeadline">Exhibit submission deadline</label>
            <input type="date" id="evDeadline" />
          </div>
        </div>
        <div class="f-row full">
          <div class="fg">
            <label for="evNotes">Notes</label>
            <textarea id="evNotes" placeholder="Booth size, special requirements…"></textarea>
          </div>
        </div>
        <div class="f-actions">
          <button class="btn-s" onclick="toggleForm('evForm')">Cancel</button>
          <button class="btn-p" onclick="saveEvent()">Save event</button>
        </div>
      </div>

      <div id="evCards"></div>
    </div>

    <!-- ── ALL TASKS ── -->
    <div class="pane hidden" id="pane-tasks">
      <div class="sec-hdr">
        <span class="sec-title">
          <i class="ti ti-checklist" aria-hidden="true"></i> All tasks
        </span>
        <button class="add-btn ghost" onclick="openAddTask(null)">
          <i class="ti ti-plus" aria-hidden="true"></i> Add task
        </button>
      </div>
      <div class="filter-bar" id="taskChips"></div>
      <div id="taskRows"></div>
    </div>

    <!-- ── DESIGNER BRIEF ── -->
    <div class="pane hidden" id="pane-brief">
      <div class="sec-hdr">
        <span class="sec-title">
          <i class="ti ti-file-description" aria-hidden="true"></i> Designer brief
        </span>
        <button class="copy-btn" onclick="copyBrief()">
          <i class="ti ti-copy" aria-hidden="true"></i> Copy brief
        </button>
      </div>
      <div id="briefContent"></div>
    </div>

  </div><!-- /.app -->

  <!-- ── TASK MODAL ── -->
  <div class="modal-overlay hidden" id="taskModal" onclick="closeModal(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="event.stopPropagation()">
      <h3 id="modalTitle">
        Add task
        <button class="icon-btn" onclick="closeTaskModal()" aria-label="Close">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </h3>

      <div class="f-row full">
        <div class="fg">
          <label for="mTaskName">Task name</label>
          <input id="mTaskName" placeholder="e.g. Booth backdrop 20×8 ft" />
        </div>
      </div>

      <div class="f-row">
        <div class="fg">
          <label for="mTaskEvent">Event</label>
          <select id="mTaskEvent"></select>
        </div>
        <div class="fg">
          <label for="mTaskType">Type</label>
          <select id="mTaskType">
            <option>Booth graphics</option>
            <option>Banner</option>
            <option>Flier</option>
            <option>Product display</option>
            <option>Email blast</option>
            <option>Social media</option>
            <option>Signage</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="f-row">
        <div class="fg">
          <label for="mTaskDue">Due date</label>
          <input type="date" id="mTaskDue" />
        </div>
        <div class="fg">
          <label>Priority</label>
          <div class="priority-seg" id="mPrioritySeg">
            <button onclick="setPriority('high')" id="p-high">🔴 High</button>
            <button onclick="setPriority('med')"  id="p-med"  class="sel-med">🟡 Med</button>
            <button onclick="setPriority('low')"  id="p-low">🟢 Low</button>
          </div>
        </div>
      </div>

      <div class="f-row full">
        <div class="fg">
          <label for="mTaskNotes">Specs / notes for designer</label>
          <textarea id="mTaskNotes" placeholder="Dimensions, file format, colors…"></textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-s" onclick="closeTaskModal()">Cancel</button>
        <button class="btn-p" onclick="saveModalTask()">Save task</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
