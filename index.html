<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Show Graphics HQ</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div>
        <h1><i class="ti ti-layout-dashboard" aria-hidden="true"></i> Trade Show Graphics HQ</h1>
        <p>Event tracker · Design task manager · Designer brief</p>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="go('dash')">Dashboard</button>
        <button class="tab" onclick="go('tasks')">All tasks</button>
        <button class="tab" onclick="go('brief')">Designer brief</button>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div class="pane" id="pane-dash">
      <div class="stats" id="statsRow"></div>
      <div class="sec-header">
        <span class="sec-title">Upcoming events</span>
        <button class="add-btn" onclick="toggleForm('evForm')">
          <i class="ti ti-plus" aria-hidden="true"></i> Add event
        </button>
      </div>
      <div class="form-panel" id="evForm" style="display:none">
        <div class="f-row">
          <div class="fg"><label>Event name</label><input id="evName" placeholder="e.g. PRINTING United 2026" /></div>
          <div class="fg"><label>Event dates</label><input id="evDates" placeholder="e.g. Oct 22–24, 2026" /></div>
        </div>
        <div class="f-row">
          <div class="fg"><label>City / venue</label><input id="evVenue" placeholder="e.g. Las Vegas Convention Center" /></div>
          <div class="fg"><label>Exhibit submission deadline</label><input type="date" id="evDeadline" /></div>
        </div>
        <div class="f-row full">
          <div class="fg"><label>Notes (booth size, special requirements, etc.)</label>
            <textarea id="evNotes" placeholder="Optional…"></textarea>
          </div>
        </div>
        <div class="f-actions">
          <button class="btn-s" onclick="toggleForm('evForm')">Cancel</button>
          <button class="btn-p" onclick="saveEvent()">Save event</button>
        </div>
      </div>
      <div id="evCards"></div>
    </div>

    <!-- ALL TASKS -->
    <div class="pane hidden" id="pane-tasks">
      <div class="sec-header">
        <span class="sec-title">All design tasks</span>
        <button class="add-btn" onclick="toggleForm('taskForm')">
          <i class="ti ti-plus" aria-hidden="true"></i> Add task
        </button>
      </div>
      <div class="form-panel" id="taskForm" style="display:none">
        <div class="f-row">
          <div class="fg"><label>Task name</label><input id="tName" placeholder="e.g. Booth backdrop 20×8 ft" /></div>
          <div class="fg"><label>Event</label><select id="tEvent"></select></div>
        </div>
        <div class="f-row three">
          <div class="fg">
            <label>Type</label>
            <select id="tType">
              <option>Booth graphics</option>
              <option>Banner</option>
              <option>Flier</option>
              <option>Product display</option>
              <option>Email blast</option>
              <option>Social media</option>
              <option>Signage</option>
              <option>Other</option>
            </select>
          </div>
          <div class="fg">
            <label>Priority</label>
            <select id="tPriority">
              <option value="high">🔴 High</option>
              <option value="med" selected>🟡 Medium</option>
              <option value="low">🟢 Low</option>
            </select>
          </div>
          <div class="fg"><label>Due date</label><input type="date" id="tDue" /></div>
        </div>
        <div class="f-row full">
          <div class="fg"><label>Specs / notes for designer</label>
            <textarea id="tNotes" placeholder="Dimensions, bleed, file format, brand colors…"></textarea>
          </div>
        </div>
        <div class="f-actions">
          <button class="btn-s" onclick="toggleForm('taskForm')">Cancel</button>
          <button class="btn-p" onclick="saveTask()">Save task</button>
        </div>
      </div>
      <div class="filter-bar" id="taskChips"></div>
      <div id="taskRows"></div>
    </div>

    <!-- DESIGNER BRIEF -->
    <div class="pane hidden" id="pane-brief">
      <div class="sec-header">
        <span class="sec-title">Designer brief</span>
        <button class="copy-btn" onclick="copyBrief()">
          <i class="ti ti-copy" aria-hidden="true"></i> Copy brief
        </button>
      </div>
      <p class="brief-desc">A ready-to-share summary for your graphic design manager — shows all upcoming events and tasks sorted by priority and deadline.</p>
      <div id="briefContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
